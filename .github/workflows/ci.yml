name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chatapp_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the production image and boots it against a throwaway Postgres,
      # so a broken Dockerfile fails here rather than at deploy time.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: chat-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Postgres
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=chatapp -p 5432:5432 postgres:16
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && break
            sleep 2
          done

      - name: Boot the image and check it serves
        run: |
          docker run -d --name chatapp --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/chatapp" \
            -e JWT_SECRET="$(head -c 32 /dev/urandom | base64 | tr -d '=+/' | head -c 40)" \
            chat-app:ci

          # The container runs migrations before listening, so poll rather than sleep.
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then
              echo "container healthy"
              curl -sf http://127.0.0.1:3000/ | head -c 200; echo
              # The SPA must be served from the image, not just the API.
              curl -sf http://127.0.0.1:3000/chat | grep -q "<div id=\"root\">" \
                && echo "SPA served OK" && exit 0
              echo "SPA not served"; exit 1
            fi
            sleep 2
          done
          echo "container never became healthy"; docker logs chatapp; exit 1

      # Real-time chat is the app's only long-lived connection, and every way it
      # breaks is silent: the SPA fallback swallowing /api/chat/stream, a
      # buffering layer holding the frames, or the response never being
      # flushed all look like "no new messages" rather than an error. Assert it
      # against the real image instead of finding out in production.
      - name: Check the SSE chat stream
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000

          # Without a ticket the route must answer with the JSON 401 from the
          # API, never the index.html shell an SPA fallback would serve.
          code=$(curl -s -o /tmp/nostream.txt -w '%{http_code}' "$base/api/chat/stream")
          if [ "$code" != "401" ] || ! grep -q '"error"' /tmp/nostream.txt; then
            echo "expected a JSON 401 without a ticket, got $code:"; cat /tmp/nostream.txt; exit 1
          fi

          # Then the real path: seed a couple of users, log in, mint a
          # ticket, open the stream. Credentials are the seed defaults
          # against a throwaway container, so nothing here is a real secret.
          docker exec chatapp node prisma/seed.js
          token=$(curl -sf -X POST "$base/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"alice@example.com","password":"changeme123"}' \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$token" || { echo "login returned no token"; exit 1; }
          ticket=$(curl -sf -X POST "$base/api/chat/stream-ticket" \
            -H "Authorization: Bearer $token" \
            | sed -n 's/.*"ticket":"\([^"]*\)".*/\1/p')
          test -n "$ticket" || { echo "no stream ticket issued"; exit 1; }

          # The response never ends, so curl is meant to hit --max-time and exit
          # 28; the headers it already wrote are what we assert on.
          curl -s -N --max-time 5 -D /tmp/stream-headers.txt -o /dev/null \
            "$base/api/chat/stream?ticket=$ticket" || true
          grep -q '^HTTP/1.1 200' /tmp/stream-headers.txt \
            || { echo "stream did not return 200:"; cat /tmp/stream-headers.txt; exit 1; }
          grep -qi '^content-type: text/event-stream' /tmp/stream-headers.txt \
            || { echo "stream is not text/event-stream:"; cat /tmp/stream-headers.txt; exit 1; }
          echo "SSE stream OK"

      - name: Container logs on failure
        if: failure()
        run: docker logs chatapp || true
