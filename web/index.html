<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Both values are the design tokens from index.css, not independent
         choices: #22315c is --accent (the "ink" the whole UI is built on) and
         #181a22 is dark mode's --bg. Two entries because a single theme-color
         leaves the browser chrome light while the app is dark. These were
         #6d28d9 (violet) — left over from the palette the Claim Ticket
         design replaced, so the browser chrome never matched the app. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#22315c" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181a22" />

    <!-- iOS ignores most of the manifest for "Add to Home Screen" and relies
         on these instead (Safari 16.4+ reads manifest icons too, but these
         cover older iOS and are what actually controls the status bar). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chat" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
