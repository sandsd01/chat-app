<!-- The claim-ticket mark: a stub with a torn perforation notch on each side
     and the tear-off line before the counterfoil. Same silhouette as the
     inline mark in web/src/components/AuthBrand.jsx and the PWA icons in
     icons/ — one shape everywhere, so the app is recognisable at 16px in a
     tab and at 512px on a home screen. Colours are index.css tokens:
     #22315c is --accent, #fbfaf8 is --bg. Drawn as a single evenodd path so
     the tear-off line is a hole rather than a second colour, which keeps the
     mark monochrome-capable. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Chat">
  <rect width="64" height="64" rx="12" fill="#22315c"/>
  <path fill="#fbfaf8" fill-rule="evenodd" d="M9 20 L55 20 A3 3 0 0 1 58 23 L58 28 A4 4 0 0 0 58 36 L58 41 A3 3 0 0 1 55 44 L9 44 A3 3 0 0 1 6 41 L6 36 A4 4 0 0 0 6 28 L6 23 A3 3 0 0 1 9 20 Z M45 24 L47 24 L47 40 L45 40 Z"/>
</svg>
